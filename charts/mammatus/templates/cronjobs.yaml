{{- range .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ include "mammatus.name" $ }}
    app.kubernetes.io/instance: {{ .name }}
spec:
{{- if eq $.Values.release "dev" }}
  schedule: "* * * * *"
{{- else }}
  schedule: "{{ .schedule }}"
{{- end }}
  timeZone: "{{ default $.Values.timeZone .timeZone }}"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        {{- if or $.Values.podLabels $.Values.podAnnotations }}
        metadata:
          {{- with $.Values.podLabels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        spec:
          {{- with $.Values.priorityClassName }}
          priorityClassName: "{{ . }}"
          {{- end }}
          restartPolicy: Never
          {{- include "mammatus.pod" (dict "Chart" $.Chart "Values" $.Values "name" .name "arguments" (list .class) "command" "mammatus-cron" "addOns" .addOns) | nindent 10 }}
{{- end }}
